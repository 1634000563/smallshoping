<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小小商城 - 首页</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航（图标 + 文字） -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        小小商城
      </a>
      <nav class="nav">
        <a class="nav-item active" href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          首页
        </a>
        <a class="nav-item" href="index.html#products">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          商品
        </a>
        <a class="nav-item is-cart" href="cart.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          购物车
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Banner -->
    <section class="banner">
      <div class="banner-copy">
        <span class="banner-tag">开学季 · 限时特惠</span>
        <h1>好物精选，一站购齐</h1>
        <p>数码 · 服饰 · 生活好物，全场低至 5 折起，更有新人专属优惠券等你领取。</p>
        <a class="btn" href="#products" style="align-self:flex-start">立即选购</a>
      </div>
      <img class="banner-img" id="banner-img" src="" alt="活动 Banner" />
    </section>

    <!-- 商品区 -->
    <section id="products">
      <div class="section-title">
        <h2>精选商品</h2>
        <div class="chips" id="category-chips">
          <button class="chip active" data-cat="all">全部</button>
          <button class="chip" data-cat="数码">数码</button>
          <button class="chip" data-cat="服饰">服饰</button>
          <button class="chip" data-cat="生活">生活</button>
        </div>
      </div>
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 小小商城 · 仅用于演示</div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
