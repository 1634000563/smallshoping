<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小小商城 - 购物车</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部导航（图标 + 文字） -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        小小商城
      </a>
      <nav class="nav">
        <a class="nav-item" href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          首页
        </a>
        <a class="nav-item" href="index.html#products">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          商品
        </a>
        <a class="nav-item is-cart active" href="cart.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          购物车
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="section-title" style="margin-top:24px">
      <h2>我的购物车</h2>
    </div>

    <div class="cart-layout" id="cart-layout" style="display:none">
      <div class="cart-list" id="cart-list"></div>
      <aside class="summary-card">
        <h3>订单摘要</h3>
        <div class="summary-row"><span>商品件数</span><span id="sum-count">0 件</span></div>
        <div class="summary-row"><span>运费</span><span>免运费</span></div>
        <div class="summary-row total"><span>合计</span><strong id="sum-total">¥0</strong></div>
        <button class="btn" id="checkout-btn">去结算</button>
      </aside>
    </div>

    <div class="empty-state" id="empty-state" style="display:none">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <p>购物车还是空的，快去逛逛吧～</p>
      <a class="btn" href="index.html">去选购</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 小小商城 · 仅用于演示</div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
